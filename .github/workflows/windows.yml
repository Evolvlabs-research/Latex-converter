# Nabla pour Windows : tests, puis Nabla.exe en .zip et en installeur. Sur un tag vX.Y.Z, les deux sont ajoutés à la Release.
name: Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [windows/**, app/Sources/**, CHANGELOG.md, .github/workflows/windows.yml]
  pull_request:
    paths: [windows/**, app/Sources/**, CHANGELOG.md, .github/workflows/windows.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  PDFIUM: chromium/8125 # même version que la fonction pdfium_latest de pdfium-render
  CARGO_TERM_COLOR: always
defaults:
  run:
    shell: pwsh
    working-directory: windows

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: PDFium
        run: |
          curl.exe -sSfL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/$env:PDFIUM/pdfium-win-x64.tgz"
          New-Item -ItemType Directory -Force pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
      - name: Tests
        run: cargo test --release
      - name: Construire
        run: cargo build --release
      - name: Paquets
        run: |
          $v = (Select-String -Path ../CHANGELOG.md -Pattern '^## v([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/Nabla | Out-Null
          Copy-Item target/release/nabla.exe dist/Nabla/Nabla.exe
          Copy-Item pdfium/bin/pdfium.dll dist/Nabla/
          Copy-Item ../LICENSE dist/Nabla/LICENSE.txt
          Compress-Archive -Path dist/Nabla -DestinationPath "dist/Nabla-$v-windows.zip" -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VERSION=$v" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Nabla-${{ env.VERSION }}-windows
          path: |
            windows/dist/*.zip
            windows/dist/*.exe
      - name: Ajouter à la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.sh crée la Release juste après avoir poussé le tag : on l'attend au besoin
          for ($i = 0; $i -lt 30 -and -not (gh release view $env:GITHUB_REF_NAME 2>$null); $i++) { Start-Sleep 20 }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip, dist/*.exe) --clobber

  # Compilation LaTeX et SyncTeX sous Windows avec MiKTeX, la distribution conseillée aux utilisateurs
  # (Perl, dont son latexmk a besoin, est déjà sur les machines windows-latest).
  latex:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: MiKTeX
        run: |
          choco install miktex --no-progress -y
          $bin = "$env:ProgramFiles\MiKTeX\miktex\bin\x64"
          $env:PATH = "$bin;$env:PATH"
          initexmf --admin --set-config-value "[MPM]AutoInstall=1"  # paquets manquants installés à la compilation
          miktex --admin packages update-package-database
          miktex --admin packages install latexmk
          # sans cette recherche de mises à jour, MiKTeX refuse de compiler (« major issue »)
          miktex --admin packages check-update
          miktex packages check-update
          $bin >> $env:GITHUB_PATH
      - name: Tests avec LaTeX
        env:
          NABLA_REQUIRE_TEX: "1"
        # un à la fois : MiKTeX installe les paquets manquants pendant la compilation, deux installations à la fois se gênent
        run: cargo test --release -- --test-threads=1 project_build_and_sync templates_compile
