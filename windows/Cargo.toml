[package]
name = "nabla"
version = "1.0.0"
description = "Nabla pour Windows : éditeur LaTeX local, sans compte"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pdfium-render = "0.9.6"
regex = "1.13.2"
rfd = "0.18.0"
trash = "5.4.0"

[build-dependencies]
regex = "1.13.2"
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
